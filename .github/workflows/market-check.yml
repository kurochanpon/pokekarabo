name: Domestic market API check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: write
concurrency:
  group: market-history
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Save dated market observations
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, date, timezone, timedelta
          from pathlib import Path
          today = datetime.now(timezone(timedelta(hours=9))).date()
          cards = [('surugaya-g8694777','054/L-P'),('mega-charizard-x-ex-110-080','110/080'),('surugaya-gu519473','240/193'),('umbreon-ex-217-187','217/187'),('pikachu-ex-132-106','132/106'),('mew-ex-347-190','347/190')]
          errors = []
          for slug, number in cards:
              try:
                  url = 'https://kadomiru.jp/api/public/cards/' + slug
                  req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'PokecaLab/0.3 dated observations'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read(2000000))
                  if data['card']['slug'] != slug or not isinstance(data['offers'], list) or not data['offers']:
                      raise ValueError('Invalid card or missing offers')
                  if data['card']['number'] != number or data['card']['grade'] != '未鑑定':
                      raise ValueError('Card identity mismatch')
                  path = Path('data/market.json' if slug == 'surugaya-g8694777' else 'data/cards/'+slug+'.json')
                  old = json.loads(path.read_text()) if path.exists() else {'history': []}
                  history = old['history']
                  seen = {(x['shopSlug'],x['checkedAt'],x['condition'],x['channel']) for x in history}
                  offers = []
                  for o in data['offers']:
                      if type(o['price']) is not int or o['price'] <= 0 or o['currency'] != 'JPY':
                          raise ValueError('Invalid price or currency')
                      checked = date.fromisoformat(o['checkedAt'])
                      age = (today-checked).days
                      if age < 0:
                          raise ValueError('Future source date')
                      row = {k:o[k] for k in ('shop','shopSlug','price','currency','checkedAt','condition','channel','sourceUrl')}
                      row['retrievedAt'] = today.isoformat()
                      row['stale'] = age > 7
                      offers.append(row)
                      key = (row['shopSlug'],row['checkedAt'],row['condition'],row['channel'])
                      if key not in seen:
                          history.append({k:v for k,v in row.items() if k != 'stale'})
                          seen.add(key)
                  result = {'card':data['card'],'attribution':data['attribution'],'notice':data['notice'],'retrievedAt':today.isoformat(),'staleAfterDays':7,'offers':offers,'history':history}
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  print('Saved',len(offers),'offers;',sum(x['stale'] for x in offers),'stale;',len(history),'unique historical observations')
              except Exception as e:
                  errors.append(slug)
                  print('FAILED',slug,type(e).__name__,str(e))
          Path('/tmp/market-errors').write_text('\n'.join(errors))
          PY
      - name: Commit observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Record dated market observations"
            git push
          fi
          if [ -s /tmp/market-errors ]; then cat /tmp/market-errors; exit 1; fi
