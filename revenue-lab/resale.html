<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フリマ販売の手取り・損益分岐点計算 | 暮らしの計算ラボ</title><meta name="description" content="販売価格、販売手数料、送料、仕入れ原価から手取りと利益、赤字にならない販売価格を計算。"><style>body{font:16px system-ui,sans-serif;line-height:1.7;max-width:700px;margin:auto;padding:20px}label{display:block;margin:12px 0}input{display:block;width:90%;padding:8px;font:inherit}output{display:block;white-space:pre-line;font-weight:bold;background:#eef4f5;padding:16px}</style></head><body><nav><a href="./">計算ラボ</a> / <a href="privacy.html">プライバシー</a></nav><h1>フリマ販売の手取り・損益分岐点計算</h1><p>販売手数料率は利用サービスの最新条件を確認して入力してください。初期値は計算例です。</p><label>販売価格（円）<input id="p" type="number" min="0" step="1" value="3000"></label><label>販売手数料率（%）<input id="r" type="number" min="0" max="99.99" step="0.01" value="10"></label><label>送料・梱包費（円）<input id="s" type="number" min="0" step="1" value="450"></label><label>仕入れ原価（円）<input id="c" type="number" min="0" step="1" value="1500"></label><output id="o" aria-live="polite"></output><h2>計算方法</h2><p>手取り＝販売価格−販売手数料−送料・梱包費。利益＝手取り−仕入れ原価。損益分岐点は（送料・梱包費＋仕入れ原価）÷（1−手数料率）を切り上げた目安です。手数料は安全側に切り上げます。振込手数料、税金などは含みません。</p><p>例：3,000円で販売、手数料10%、送料450円、原価1,500円なら手取り2,250円、利益750円です。</p><script>const ids=['p','r','s','c'];function calc(p,r,s,c){const fee=Math.ceil(p*Math.round(r*100)/10000);return [p-fee-s,p-fee-s-c,Math.ceil((s+c)*10000/(10000-Math.round(r*100)))]}function render(){const a=ids.map(id=>document.getElementById(id));const v=a.map(x=>x.valueAsNumber);document.getElementById('o').textContent=a.every(x=>x.validity.valid)&&v.every(Number.isFinite)&&v[1]<100?calc(...v).map((x,i)=>['手取り','利益','損益分岐点'][i]+'：'+x.toLocaleString('ja-JP')+' 円').join('\n'):'入力値を確認してください'}document.addEventListener('input',render);render();</script></body></html>
