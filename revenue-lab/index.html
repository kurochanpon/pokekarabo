<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="日常の計算をブラウザで簡単に。割引、税込価格、利益率を計算できます。"><title>暮らしの計算ラボ</title><style>body{font:16px system-ui,sans-serif;line-height:1.7;background:#f6f8fa;color:#17212b;margin:0}main{max-width:760px;margin:auto;padding:24px}section{background:white;border:1px solid #dce3e8;border-radius:14px;padding:20px;margin:20px 0}label{display:block;margin:12px 0}input{display:block;width:95%;padding:10px;font:inherit;border:1px solid #aab5bf;border-radius:6px}output{display:block;font-size:1.5rem;font-weight:bold;color:#145a60}small{color:#566}h1{line-height:1.3}</style></head><body><main><h1>暮らしの計算ラボ</h1><p>買い物や販売に役立つ無料計算ツール。入力値はブラウザ内だけで計算します。</p><section><h2>割引価格計算</h2><label>元の価格（円）<input id="price" type="number" min="0" value="10000"></label><label>割引率（%）<input id="discount" type="number" min="0" max="100" value="20"></label><output id="discountResult" aria-live="polite"></output><p>元の価格 ×（1 − 割引率 ÷ 100）。端数は目安として四捨五入します。</p></section><section><h2>税込価格計算</h2><label>税抜価格（円）<input id="net" type="number" min="0" value="1000"></label><label>税率（%）<input id="tax" type="number" min="0" max="100" value="10"></label><output id="taxResult" aria-live="polite"></output><p>税抜価格 ×（1 ＋ 税率 ÷ 100）。実際の端数処理は販売者により異なります。</p></section><section><h2>粗利益率計算</h2><label>売上（円）<input id="sales" type="number" min="0" value="10000"></label><label>原価（円）<input id="cost" type="number" min="0" value="8000"></label><output id="profitResult" aria-live="polite"></output><p>粗利益率は（売上 − 原価）÷ 売上 × 100。手数料や経費を含まない簡易計算です。</p></section><footer><small>試験運用版・広告未掲載。計算結果は参考値です。</small></footer></main><script>const el=id=>document.getElementById(id);const n=id=>el(id).valueAsNumber;const valid=(id)=>el(id).validity.valid&&Number.isFinite(n(id));const yen=x=>Math.round(x).toLocaleString('ja-JP')+' 円';function run(){el('discountResult').textContent=valid('price')&&valid('discount')?yen(n('price')*(1-n('discount')/100)):'入力を確認してください';el('taxResult').textContent=valid('net')&&valid('tax')?yen(n('net')*(1+n('tax')/100)):'入力を確認してください';el('profitResult').textContent=valid('sales')&&valid('cost')&&n('sales')>0?yen(n('sales')-n('cost'))+' ／ '+((n('sales')-n('cost'))/n('sales')*100).toFixed(2)+'%':'売上は0より大きい値を入力してください'}document.addEventListener('input',run);run();</script></body></html>
